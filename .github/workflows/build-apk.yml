name: Build APK

# Chạy thủ công: vào tab Actions > Build APK > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tạo dự án Capacitor
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor/app@7
          mkdir www
          echo '<!doctype html><meta charset="utf-8"><title>Dousob</title><body style="background:#0b1020"></body>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.dousob.bamgio",
            "appName": "Dousob - Manage your time",
            "webDir": "www",
            "server": {
              "url": "https://namnguyen95800-coder.github.io/"
            },
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_timer",
                "iconColor": "#2DBE9D"
              }
            }
          }
          EOF
          npx cap add android

      - name: Chuông, icon thông báo và plugin đồng hồ chạy nền
        run: |
          A=app/android/app/src/main
          mkdir -p $A/res/raw $A/res/drawable $A/java/com/dousob/bamgio
          if [ -f icon-192.png ]; then cp icon-192.png $A/res/drawable/notif_large.png; fi
          python3 - <<'PY'
          import wave, struct, math
          sr = 22050
          def tone(freq, dur, vol=0.8):
              n = int(sr * dur)
              out = []
              for i in range(n):
                  t = i / sr
                  a = min(1.0, t / 0.01) * math.exp(-3.0 * t / dur)
                  v = math.sin(2*math.pi*freq*t) + 0.35*math.sin(2*math.pi*freq*2*t) + 0.15*math.sin(2*math.pi*freq*3*t)
                  out.append(vol * a * v / 1.5)
              return out
          def silence(dur):
              return [0.0] * int(sr * dur)
          seq = []
          for rep in range(3):
              for f in (880, 1175, 1568):
                  seq += tone(f, 0.28)
                  seq += silence(0.04)
              seq += tone(1568, 0.5)
              seq += silence(0.9)
          w = wave.open('app/android/app/src/main/res/raw/alarm.wav', 'wb')
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
          for s in seq:
              w.writeframes(struct.pack('<h', int(max(-1, min(1, s)) * 32000)))
          w.close()
          PY
          cat > $A/res/drawable/ic_stat_timer.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF"
                android:pathData="M15,1L9,1v2h6L15,1zM11,14h2L13,8h-2v6zM19.03,7.39l1.42,-1.42c-0.43,-0.51 -0.9,-0.99 -1.41,-1.41l-1.42,1.42C16.07,4.74 14.12,4 12,4c-4.97,0 -9,4.03 -9,9s4.02,9 9,9 9,-4.03 9,-9c0,-2.12 -0.74,-4.07 -1.97,-5.61zM12,20c-3.87,0 -7,-3.13 -7,-7s3.13,-7 7,-7 7,3.13 7,7 -3.13,7 -7,7z"/>
          </vector>
          XML
          cat > $A/java/com/dousob/bamgio/MainActivity.java <<'JAVA'
          package com.dousob.bamgio;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(TimerNotifPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          cat > $A/java/com/dousob/bamgio/TimerNotifPlugin.java <<'JAVA'
          package com.dousob.bamgio;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "TimerNotif")
          public class TimerNotifPlugin extends Plugin {
              private static final String CH = "running";

              @PluginMethod
              public void show(PluginCall call) {
                  try {
                      Context ctx = getContext();
                      JSObject d = call.getData();
                      int id = d.optInt("id", 9001);
                      String title = d.optString("title", "");
                      String text = d.optString("text", "");
                      long when = d.optLong("when", System.currentTimeMillis());
                      boolean countdown = d.optBoolean("countdown", false);
                      long timeout = d.optLong("timeout", 0);

                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel(CH, "\u0110\u1ed3ng h\u1ed3 \u0111ang ch\u1ea1y", NotificationManager.IMPORTANCE_LOW);
                          ch.setSound(null, null);
                          ch.setShowBadge(false);
                          nm.createNotificationChannel(ch);
                      }
                      Intent open = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
                      if (open == null) open = new Intent();
                      PendingIntent pi = PendingIntent.getActivity(ctx, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      int icon = ctx.getResources().getIdentifier("ic_stat_timer", "drawable", ctx.getPackageName());
                      if (icon == 0) icon = ctx.getApplicationInfo().icon;

                      NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, CH)
                          .setSmallIcon(icon)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setShowWhen(true)
                          .setWhen(when)
                          .setUsesChronometer(true)
                          .setColor(0xFF2DBE9D)
                          .setCategory(NotificationCompat.CATEGORY_PROGRESS)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC);
                      if (countdown) {
                          b.setChronometerCountDown(true);
                          if (timeout > 0) b.setTimeoutAfter(timeout);
                      }
                      nm.notify(id, b.build());
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void cancel(PluginCall call) {
                  try {
                      NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.cancel(call.getData().optInt("id", 9001));
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA

      - name: Quyền báo thức và thông báo
        run: |
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application|' "$M"
          grep -n "uses-permission" "$M"

      - name: Icon app (lấy icon-512.png hoặc icon-192.png của web)
        run: |
          SRC=""
          for f in icon-512.png icon-192.png; do
            if [ -f "$f" ]; then SRC="$f"; break; fi
          done
          if [ -n "$SRC" ]; then
            RES=app/android/app/src/main/res
            rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
            for d in $RES/mipmap-*dpi; do
              cp "$SRC" "$d/ic_launcher.png"
              cp "$SRC" "$d/ic_launcher_round.png"
              cp "$SRC" "$d/ic_launcher_foreground.png"
            done
            echo "Đã dùng icon: $SRC"
          else
            echo "Không thấy icon, dùng icon mặc định"
          fi

