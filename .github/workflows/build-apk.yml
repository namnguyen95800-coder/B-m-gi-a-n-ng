      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Đăng APK lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk Dousob.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Dousob.apk --title "APK mới nhất" --notes "Bản APK Android mới nhất của Bấm giờ." --latest
