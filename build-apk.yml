name: Build APK

# Chạy thủ công: vào tab Actions > Build APK > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUN: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tạo dự án Capacitor
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor/app@7 @capacitor/filesystem@7 @capacitor/share@7
          mkdir www
          echo '<!doctype html><meta charset="utf-8"><title>Dousob</title><body style="background:#0b1020"></body>' > www/index.html
          cp ../index.html ../manifest.json ../icon-192.png ../icon-512.png ../og-image.png ../ung-ho-mb.png ../ung-ho-momo.png www/ || true
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.dousob.bamgio",
            "appName": "Dousob - Manage your time",
            "webDir": "www",
            "backgroundColor": "#0b1020",
            "server": {
              "url": "https://namnguyen95800-coder.github.io/",
              "errorPath": "index.html"
            },
            "android": {
              "adjustMarginsForEdgeToEdge": "auto"
            },
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_timer",
                "iconColor": "#2DBE9D"
              }
            }
          }
          JSON
          npx cap add android

      - name: Chuông, icon, màn hình khởi động và plugin Android
        run: |
          A=app/android/app/src/main
          mkdir -p $A/res/raw $A/res/drawable $A/java/com/dousob/bamgio
          if [ -f icon-192.png ]; then cp icon-192.png $A/res/drawable/notif_large.png; fi
          python3 - <<'PY'
          import wave, struct, math
          sr = 22050
          def tone(freq, dur, vol=0.8):
              n = int(sr * dur)
              out = []
              for i in range(n):
                  t = i / sr
                  a = min(1.0, t / 0.01) * math.exp(-3.0 * t / dur)
                  v = math.sin(2*math.pi*freq*t) + 0.35*math.sin(2*math.pi*freq*2*t) + 0.15*math.sin(2*math.pi*freq*3*t)
                  out.append(vol * a * v / 1.5)
              return out
          def silence(dur):
              return [0.0] * int(sr * dur)
          seq = []
          for rep in range(3):
              for f in (880, 1175, 1568):
                  seq += tone(f, 0.28)
                  seq += silence(0.04)
              seq += tone(1568, 0.5)
              seq += silence(0.9)
          w = wave.open('app/android/app/src/main/res/raw/alarm.wav', 'wb')
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
          for s in seq:
              w.writeframes(struct.pack('<h', int(max(-1, min(1, s)) * 32000)))
          w.close()
          PY
          python3 - <<'PY'
          import glob, struct, zlib
          def ch(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', 1, 1, 8, 2, 0, 0, 0)) + ch(b'IDAT', zlib.compress(b'\x00' + bytes((11, 16, 32)))) + ch(b'IEND', b'')
          files = glob.glob('app/android/app/src/main/res/**/splash.png', recursive=True)
          for f in files:
              open(f, 'wb').write(png)
          print('splash thay:', len(files))
          PY
          cat > $A/res/drawable/ic_stat_timer.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF"
                android:pathData="M15,1L9,1v2h6L15,1zM11,14h2L13,8h-2v6zM19.03,7.39l1.42,-1.42c-0.43,-0.51 -0.9,-0.99 -1.41,-1.41l-1.42,1.42C16.07,4.74 14.12,4 12,4c-4.97,0 -9,4.03 -9,9s4.02,9 9,9 9,-4.03 9,-9c0,-2.12 -0.74,-4.07 -1.97,-5.61zM12,20c-3.87,0 -7,-3.13 -7,-7s3.13,-7 7,-7 7,3.13 7,7 -3.13,7 -7,7z"/>
          </vector>
          XML
          cat > $A/java/com/dousob/bamgio/NotifActionReceiver.java <<'JAVA'
          package com.dousob.bamgio;

          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class NotifActionReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent i) {
                  String act = i.getStringExtra("act");
                  String key = i.getStringExtra("key");
                  int id = i.getIntExtra("id", 0);
                  if (act == null) return;
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  TimerNotifPlugin p = TimerNotifPlugin.instance;
                  if (p != null) {
                      if ("off".equals(act)) nm.cancel(id);
                      p.emitAction(key == null ? "" : key, act);
                      return;
                  }
                  nm.cancel(id);
                  ctx.getSharedPreferences("bg_pending", Context.MODE_PRIVATE).edit()
                      .putString("key", key == null ? "" : key)
                      .putString("act", act)
                      .apply();
              }
          }
