          package com.dousob.bamgio;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.res.Configuration;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.SystemClock;
          import android.speech.tts.TextToSpeech;
          import java.util.Locale;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.RemoteViews;
          import androidx.core.app.NotificationCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "TimerNotif")
          public class TimerNotifPlugin extends Plugin {
              private static final String CH = "running2";
              static TimerNotifPlugin instance;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private boolean ttsLangOk = false;
              private String ttsPending = null;
              private String ttsLang = "vi-VN";

              @Override
              public void load() {
                  instance = this;
              }

              private void ttsSetLang(String lang) {
                  try {
                      int r = tts.setLanguage(Locale.forLanguageTag(lang));
                      ttsLangOk = (r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED);
                  } catch (Exception e) {
                      ttsLangOk = false;
                  }
              }

              @PluginMethod
              public void speak(PluginCall call) {
                  try {
                      final String text = call.getData().optString("text", "");
                      final String lang = call.getData().optString("lang", "vi-VN");
                      if (text.length() == 0) {
                          call.resolve();
                          return;
                      }
                      ttsLang = lang;
                      if (tts == null) {
                          ttsPending = text;
                          tts = new TextToSpeech(getContext(), new TextToSpeech.OnInitListener() {
                              @Override
                              public void onInit(int status) {
                                  if (status == TextToSpeech.SUCCESS) {
                                      ttsReady = true;
                                      ttsSetLang(ttsLang);
                                      if (ttsPending != null) {
                                          tts.speak(ttsPending, TextToSpeech.QUEUE_FLUSH, null, "bg");
                                          ttsPending = null;
                                      }
                                  }
                              }
                          });
                      } else if (ttsReady) {
                          ttsSetLang(lang);
                          tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "bg");
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void ttsInfo(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("ready", ttsReady);
                  r.put("langOk", ttsLangOk);
                  call.resolve(r);
              }

              @PluginMethod
              public void brightness(final PluginCall call) {
                  final float v = (float) call.getData().optDouble("v", -1);
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Window w = getActivity().getWindow();
                              WindowManager.LayoutParams p = w.getAttributes();
                              p.screenBrightness = v < 0 ? WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE : Math.max(0.01f, Math.min(1f, v));
                              w.setAttributes(p);
                              call.resolve();
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          }
                      }
                  });
              }

              @Override
              protected void handleOnDestroy() {
                  if (instance == this) instance = null;
                  try {
                      if (tts != null) {
                          tts.stop();
                          tts.shutdown();
                      }
                  } catch (Exception e) {
                  }
                  tts = null;
                  ttsReady = false;
              }

              void emitAction(String key, String act) {
                  JSObject o = new JSObject();
                  o.put("key", key);
                  o.put("act", act);
                  notifyListeners("action", o, true);
              }

              private int rid(Context ctx, String type, String name) {
                  return ctx.getResources().getIdentifier(name, type, ctx.getPackageName());
              }

              private PendingIntent actionIntent(Context ctx, int id, String key, String act, int n) {
                  Intent i = new Intent(ctx, NotifActionReceiver.class);
                  i.setAction("com.dousob.bamgio.ACT");
                  i.putExtra("key", key);
                  i.putExtra("act", act);
                  i.putExtra("id", id);
                  return PendingIntent.getBroadcast(ctx, id * 4 + n, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private void button(RemoteViews rv, Context ctx, String viewName, String icon, String act, int id, String key, int n, int tint) {
                  int v = rid(ctx, "id", viewName);
                  rv.setViewVisibility(v, View.VISIBLE);
                  rv.setImageViewResource(v, rid(ctx, "drawable", icon));
                  rv.setInt(v, "setColorFilter", tint);
                  rv.setOnClickPendingIntent(v, actionIntent(ctx, id, key, act, n));
              }

              private RemoteViews buildViews(Context ctx, int id, String key, String title, String text, long when,
                                             boolean countdown, boolean paused, String st, boolean pauseOn, String next) {
                  RemoteViews rv = new RemoteViews(ctx.getPackageName(), rid(ctx, "layout", "notif_timer"));
                  boolean night = (ctx.getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
                  int tint = night ? 0xFFEDEDED : 0xFF303030;
                  rv.setTextViewText(rid(ctx, "id", "nt_title"), text.length() > 0 ? title + "\n" + text : title);
                  int t = rid(ctx, "id", "nt_time");
                  int s = rid(ctx, "id", "nt_static");
                  if (paused) {
                      rv.setViewVisibility(t, View.GONE);
                      rv.setViewVisibility(s, View.VISIBLE);
                      rv.setTextViewText(s, st);
                  } else {
                      rv.setViewVisibility(s, View.GONE);
                      rv.setViewVisibility(t, View.VISIBLE);
                      long base = SystemClock.elapsedRealtime() + (when - System.currentTimeMillis());
                      rv.setChronometer(t, base, null, true);
                      if (Build.VERSION.SDK_INT >= 24) rv.setChronometerCountDown(t, countdown);
                  }
                  button(rv, ctx, "nt_a", pauseOn ? "ic_nt_pause" : "ic_nt_play", "pause", id, key, 0, tint);
                  if (next.length() > 0) {
                      button(rv, ctx, "nt_b", next.equals("lap") ? "ic_nt_flag" : "ic_nt_next", "next", id, key, 1, tint);
                  } else {
                      rv.setViewVisibility(rid(ctx, "id", "nt_b"), View.GONE);
                  }
                  button(rv, ctx, "nt_c", "ic_nt_close", "off", id, key, 2, tint);
                  return rv;
              }

              @PluginMethod
              public void show(PluginCall call) {
                  try {
                      Context ctx = getContext();
                      JSObject d = call.getData();
                      int id = d.optInt("id", 9001);
                      String key = d.optString("key", "");
                      String title = d.optString("title", "");
                      String text = d.optString("text", "");
                      long when = d.optLong("when", System.currentTimeMillis());
                      boolean countdown = d.optBoolean("countdown", false);
                      long timeout = d.optLong("timeout", 0);
                      boolean paused = d.optBoolean("paused", false);
                      String st = d.optString("st", "");
                      boolean pauseOn = d.optBoolean("pauseOn", true);
                      String next = d.optString("next", "");

                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel(CH, "\u0110\u1ed3ng h\u1ed3 \u0111ang ch\u1ea1y", NotificationManager.IMPORTANCE_DEFAULT);
                          ch.setSound(null, null);
                          ch.enableVibration(false);
                          ch.setShowBadge(false);
                          ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                          nm.createNotificationChannel(ch);
                      }
                      Intent open = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
                      if (open == null) open = new Intent();
                      PendingIntent pi = PendingIntent.getActivity(ctx, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      int icon = rid(ctx, "drawable", "ic_stat_timer");
                      if (icon == 0) icon = ctx.getApplicationInfo().icon;

                      NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, CH)
                          .setSmallIcon(icon)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setShowWhen(false)
                          .setColor(0xFF2DBE9D)
                          .setCategory(NotificationCompat.CATEGORY_PROGRESS)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setStyle(new NotificationCompat.DecoratedCustomViewStyle())
                          .setCustomContentView(buildViews(ctx, id, key, title, text, when, countdown, paused, st, pauseOn, next))
                          .setCustomBigContentView(buildViews(ctx, id, key, title, text, when, countdown, paused, st, pauseOn, next));
                      if (countdown && !paused && timeout > 0) b.setTimeoutAfter(timeout);
                      nm.notify(id, b.build());
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void cancel(PluginCall call) {
                  try {
                      NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.cancel(call.getData().optInt("id", 9001));
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void cancelAll(PluginCall call) {
                  try {
                      NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                      for (int i = 9001; i < 9200; i++) nm.cancel(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void takePending(PluginCall call) {
                  try {
                      SharedPreferences sp = getContext().getSharedPreferences("bg_pending", Context.MODE_PRIVATE);
                      JSObject r = new JSObject();
                      r.put("key", sp.getString("key", ""));
                      r.put("act", sp.getString("act", ""));
                      sp.edit().clear().apply();
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              private void makeAlarmChannel(Context ctx, NotificationManager nm, String id, String name, String rawName) {
                  NotificationChannel ch = new NotificationChannel(id, name, NotificationManager.IMPORTANCE_HIGH);
                  ch.setDescription("Chu\u00f4ng b\u00e1o khi h\u1ebft gi\u1edd");
                  ch.enableVibration(true);
                  ch.setVibrationPattern(new long[] {0, 500, 250, 500, 250, 500});
                  ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  int raw = rid(ctx, "raw", rawName);
                  if (raw != 0) {
                      AudioAttributes aa = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();
                      ch.setSound(Uri.parse("android.resource://" + ctx.getPackageName() + "/" + raw), aa);
                  }
                  nm.createNotificationChannel(ch);
              }

              @PluginMethod
              public void alarmChannel(PluginCall call) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          Context ctx = getContext();
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          makeAlarmChannel(ctx, nm, "alarm3", "H\u1ebft gi\u1edd", "alarm");
                          makeAlarmChannel(ctx, nm, "alarm_beep", "H\u1ebft gi\u1edd: B\u00edp", "alarm_beep");
                          makeAlarmChannel(ctx, nm, "alarm_bell", "H\u1ebft gi\u1edd: Chu\u00f4ng", "alarm_bell");
                          makeAlarmChannel(ctx, nm, "alarm_horn", "H\u1ebft gi\u1edd: C\u00f2i", "alarm_horn");
                          makeAlarmChannel(ctx, nm, "alarm_soft", "H\u1ebft gi\u1edd: Nh\u1eb9", "alarm_soft");
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void keepAwake(final PluginCall call) {
                  final boolean on = call.getData().optBoolean("on", true);
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Window w = getActivity().getWindow();
                              if (on) {
                                  w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              } else {
                                  w.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              }
                              call.resolve();
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          }
                      }
                  });
              }

              @PluginMethod
              public void immersive(final PluginCall call) {
                  final boolean on = call.getData().optBoolean("on", true);
                  final boolean land = call.getData().optBoolean("landscape", false);
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Window w = getActivity().getWindow();
                              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                              if (on) {
                                  if (Build.VERSION.SDK_INT >= 28) {
                                      WindowManager.LayoutParams p = w.getAttributes();
                                      p.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                                      w.setAttributes(p);
                                  }
                                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                                  c.hide(WindowInsetsCompat.Type.systemBars());
                                  if (land) getActivity().setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                              } else {
                                  c.show(WindowInsetsCompat.Type.systemBars());
                                  getActivity().setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                              }
                              call.resolve();
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          }
                      }
                  });
              }
          }
          JAVA

      - name: Quyền, phiên bản và khoá ký
        run: |
          python3 - <<'PY'
          import re, os
          run = os.environ.get('RUN', '1')
          # 1) Manifest: quyền
          p = 'app/android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          perms = ['android.permission.POST_NOTIFICATIONS', 'android.permission.USE_EXACT_ALARM', 'android.permission.RECEIVE_BOOT_COMPLETED', 'android.permission.VIBRATE', 'android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'android.permission.WAKE_LOCK', 'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS']
          add = ''.join('    <uses-permission android:name="%s" />\n' % x for x in perms)
          add += '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n'
          add += '    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n'
          assert '<application' in m
          assert '</application>' in m
          assert '</activity>' in m
          m = m.replace('</activity>', '    <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />\n        </activity>', 1)
          m = m.replace('</application>', '    <receiver android:name=".NotifActionReceiver" android:exported="false" />\n    <service android:name=".MusicService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>', 1)
          m = m.replace('<application', add + '    <application', 1)
          open(p, 'w', encoding='utf-8').write(m)
          # 2) build.gradle: phiên bản, ký bản release, bỏ kiểm tra lint chặn build
          p = 'app/android/app/build.gradle'
          g = open(p, encoding='utf-8').read()
          g = re.sub(r'versionCode\s*=?\s*\d+', 'versionCode ' + run, g, count=1)
          g = re.sub(r'versionName\s*=?\s*"[^"]*"', 'versionName "1.0.' + run + '"', g, count=1)
          sign = """    signingConfigs {
                  release {
                      storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          """
          if 'signingConfigs' not in g:
              g, n = re.subn(r'(\n\s*buildTypes\s*\{)', '\n' + sign + r'\1', g, count=1)
              print('signingConfigs chen:', n)
          g, n2 = re.subn(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', g, count=1)
          print('signingConfig gan:', n2)
          open(p, 'w', encoding='utf-8').write(g)
          PY
          grep -n "uses-permission" app/android/app/src/main/AndroidManifest.xml
          grep -n "versionCode\|versionName\|signingConfig" app/android/app/build.gradle

      - name: Icon app (lấy icon-512.png hoặc icon-192.png của web)
        run: |
          SRC=""
          for f in icon-512.png icon-192.png; do
            if [ -f "$f" ]; then SRC="$f"; break; fi
          done
          if [ -n "$SRC" ]; then
            RES=app/android/app/src/main/res
            rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
            for d in $RES/mipmap-*dpi; do
              cp "$SRC" "$d/ic_launcher.png"
              cp "$SRC" "$d/ic_launcher_round.png"
              cp "$SRC" "$d/ic_launcher_foreground.png"
            done
            echo "Đã dùng icon: $SRC"
          else
            echo "Không thấy icon, dùng icon mặc định"
          fi

