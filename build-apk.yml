      - name: Build APK
        run: |
          cd app/android
          if grep -q 'signingConfig signingConfigs.release' app/build.gradle; then
            ./gradlew assembleRelease --no-daemon && OUT=app/build/outputs/apk/release/app-release.apk || { echo 'Build release lỗi, thử build debug'; ./gradlew assembleDebug --no-daemon && OUT=app/build/outputs/apk/debug/app-debug.apk; }
          else
            ./gradlew assembleDebug --no-daemon && OUT=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$OUT" ../../Dousob.apk
          echo "Đã tạo APK từ: $OUT"

      - name: Đăng APK lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Dousob.apk --title "APK mới nhất" --notes "build:${RUN} - Bản APK Android mới nhất của Bấm giờ." --latest
